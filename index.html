<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#E7E3D8" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chalkline" />
<title>Chalkline — Climbing Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100vh; background: #E7E3D8; }
  * { box-sizing: border-box; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
<body>
<div id="root"></div>

<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { createClient } from "@supabase/supabase-js";
  import { createOfflineStore } from "./offline-store.js";
  import App from "./chalkline.bundle.js";

  // ---------------------------------------------------------------
  // Real Supabase Auth + a proper relational schema with Row Level
  // Security. Every table requires a logged-in session; posts/profiles
  // are further restricted so only their owner can write or delete them,
  // and private posts are unreadable by anyone else — enforced by the
  // database itself, not just the app's UI.
  // ---------------------------------------------------------------
  const SUPABASE_URL = "https://xoibulncwgassngzqfpp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pPwSLWgykG2QAzUHNisAiA_5iURHX_2";
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  window.supabaseAuth = {
    signUp(email, password) {
      return supabase.auth.signUp({ email, password });
    },
    signIn(email, password) {
      return supabase.auth.signInWithPassword({ email, password });
    },
    signOut() {
      try { localStorage.removeItem("chalkline_last_uid"); } catch {}
      return supabase.auth.signOut();
    },
    async getSession() {
      // Remember who is signed in so the app still opens with no signal.
      try {
        const res = await supabase.auth.getSession();
        const uid = res && res.data && res.data.session && res.data.session.user && res.data.session.user.id;
        if (uid) { try { localStorage.setItem("chalkline_last_uid", uid); } catch {} return res; }
        if (navigator.onLine === false) throw new Error("offline");
        try { localStorage.removeItem("chalkline_last_uid"); } catch {}
        return res;
      } catch (err) {
        let uid = null;
        try { uid = localStorage.getItem("chalkline_last_uid"); } catch {}
        if (uid && navigator.onLine === false) return { data: { session: { user: { id: uid } } }, error: null };
        throw err;
      }
    },
  };

  // key formats used by the app: "profile:<slug>", "log:<id>",
  // "comments:<postId>", "session:<id>", "thread:<pairKey>",
  // plus the personal (non-shared) "session:me" which never reaches here.
  const TABLE_MAP = {
    profile: { table: "profiles", idCol: "slug" },
    log: { table: "posts", idCol: "id" },
    comments: { table: "comments", idCol: "post_id" },
    session: { table: "sessions", idCol: "id" },
    thread: { table: "threads", idCol: "id" },
  };

  function parseKey(key) {
    const idx = key.indexOf(":");
    if (idx === -1) return { prefix: key, id: "" };
    return { prefix: key.slice(0, idx), id: key.slice(idx + 1) };
  }

  // Read-only bridge for logged-out visitors opening a shared profile link
  // (?u=username). Only ever reads public data — never writes anything.
  window.chalklineGuest = {
    async getProfileByUsername(username) {
      const { data, error } = await supabase
        .from("profiles")
        .select("data")
        .filter("data->>username", "eq", username)
        .maybeSingle();
      if (error || !data) return null;
      return data.data;
    },
    async getPublicPosts(authorSlug) {
      const { data, error } = await supabase
        .from("posts")
        .select("data")
        .eq("author_slug", authorSlug)
        .eq("privacy", "public");
      if (error) return [];
      return (data || []).map((r) => r.data).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    },
  };

  const rawStorage = {
    async get(key, shared) {
      if (!shared) {
        const v = localStorage.getItem("chalkline_local:" + key);
        return v === null ? null : { key, value: v, shared: false };
      }
      const { prefix, id } = parseKey(key);
      const cfg = TABLE_MAP[prefix];
      if (!cfg) return null;
      const { data, error } = await supabase.from(cfg.table).select("data").eq(cfg.idCol, id).maybeSingle();
      if (error) throw error;
      return data ? { key, value: JSON.stringify(data.data), shared: true } : null;
    },

    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem("chalkline_local:" + key, value);
        return { key, value, shared: false };
      }
      const { prefix, id } = parseKey(key);
      const cfg = TABLE_MAP[prefix];
      if (!cfg) throw new Error("Unknown storage key prefix: " + prefix);
      const parsed = JSON.parse(value);
      const row = { [cfg.idCol]: id, data: parsed, updated_at: new Date().toISOString() };
      if (prefix === "log") { row.author_slug = parsed.authorSlug; row.privacy = parsed.privacy || "public"; }
      if (prefix === "session") { row.creator_slug = parsed.creatorSlug; }

      // Try UPDATE first. Using upsert() here would also evaluate the INSERT
      // policy (even for existing rows), which is stricter than UPDATE for
      // tables like sessions (anyone can update, only the host can insert) —
      // that mismatch silently broke joining/leaving sessions. Doing an
      // explicit UPDATE first, and only INSERTing when no row exists yet,
      // avoids ever needing the INSERT check to pass for a real update.
      const { data: updatedRows, error: updateError } = await supabase
        .from(cfg.table)
        .update(row)
        .eq(cfg.idCol, id)
        .select();
      if (updateError) throw updateError;
      if (!updatedRows || updatedRows.length === 0) {
        const { error: insertError } = await supabase.from(cfg.table).insert(row);
        if (insertError) throw insertError;
      }
      return { key, value, shared: true };
    },

    async delete(key, shared) {
      if (!shared) {
        localStorage.removeItem("chalkline_local:" + key);
        return { key, deleted: true, shared: false };
      }
      const { prefix, id } = parseKey(key);
      const cfg = TABLE_MAP[prefix];
      if (!cfg) return { key, deleted: true, shared: true };
      const { error } = await supabase.from(cfg.table).delete().eq(cfg.idCol, id);
      if (error) throw error;
      return { key, deleted: true, shared: true };
    },

    async list(prefixArg, shared) {
      if (!shared) {
        const keys = [];
        const p = "chalkline_local:" + (prefixArg || "");
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(p) === 0) keys.push(k.slice("chalkline_local:".length));
        }
        return { keys, prefix: prefixArg, shared: false };
      }
      const cleanPrefix = prefixArg && prefixArg.endsWith(":") ? prefixArg.slice(0, -1) : prefixArg;
      const cfg = TABLE_MAP[cleanPrefix];
      if (!cfg) return { keys: [], prefix: prefixArg, shared: true };
      const { data, error } = await supabase.from(cfg.table).select(cfg.idCol);
      if (error) throw error;
      const keys = (data || []).map((r) => `${cleanPrefix}:${r[cfg.idCol]}`);
      return { keys, prefix: prefixArg, shared: true };
    },
  };

  const offlineStore = createOfflineStore(rawStorage);
  window.storage = offlineStore;
  offlineStore.init();
  window.addEventListener("online", () => offlineStore.flush());
  setInterval(() => { if (navigator.onLine !== false) offlineStore.flush(); }, 30000);

  // small status pill: offline / changes waiting to sync
  const pill = document.createElement("div");
  pill.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 6px);z-index:9999;padding:5px 12px;border-radius:999px;font:600 12px Inter,system-ui,sans-serif;background:#F25A2C;color:#fff;display:none;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.35)";
  document.body.appendChild(pill);
  const updatePill = () => {
    const n = offlineStore.pendingCount();
    const off = navigator.onLine === false;
    pill.style.display = off || n > 0 ? "block" : "none";
    pill.textContent = off ? (n ? `Offline · ${n} change${n === 1 ? "" : "s"} waiting to sync` : "Offline · changes will sync later") : `Syncing ${n} change${n === 1 ? "" : "s"}…`;
  };
  offlineStore.subscribe(updatePill);
  window.addEventListener("online", updatePill);
  window.addEventListener("offline", updatePill);
  updatePill();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  const rootEl = document.getElementById("root");
  try {
    createRoot(rootEl).render(React.createElement(App));
  } catch (err) {
    rootEl.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;font-family:sans-serif;text-align:center;">' +
      '<h2>Could not start Chalkline</h2><p style="color:#5B5A50;max-width:360px;">' +
      (err && err.message ? err.message : "Unknown error") +
      "</p></div>";
    console.error(err);
  }
</script>
</body>
</html>
