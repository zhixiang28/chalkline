<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#E7E3D8" />
<title>Chalkline — Climbing Log</title>
<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100vh; background: #E7E3D8; }
  * { box-sizing: border-box; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
<body>
<div id="root"></div>

<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { createClient } from "@supabase/supabase-js";
  import App from "./chalkline.bundle.js";

  // ---------------------------------------------------------------
  // window.storage — backed by a real shared Supabase database.
  // "shared" data (profiles, posts, sessions, chats) is stored in
  // Postgres and synced live between every person who opens this site.
  // "personal" data (which account is logged in on THIS device) stays
  // in localStorage, since that's meant to be per-device, not shared.
  // ---------------------------------------------------------------
  const SUPABASE_URL = "https://xoibulncwgassngzqfpp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pPwSLWgykG2QAzUHNisAiA_5iURHX_2";
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  const TABLE = "chalkline_kv";

  window.storage = {
    async get(key, shared) {
      if (!shared) {
        const v = localStorage.getItem("chalkline_local:" + key);
        return v === null ? null : { key, value: v, shared: false };
      }
      const { data, error } = await supabase.from(TABLE).select("value").eq("key", key).maybeSingle();
      if (error) throw error;
      return data ? { key, value: data.value, shared: true } : null;
    },
    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem("chalkline_local:" + key, value);
        return { key, value, shared: false };
      }
      const { error } = await supabase.from(TABLE).upsert({ key, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return { key, value, shared: true };
    },
    async delete(key, shared) {
      if (!shared) {
        localStorage.removeItem("chalkline_local:" + key);
        return { key, deleted: true, shared: false };
      }
      const { error } = await supabase.from(TABLE).delete().eq("key", key);
      if (error) throw error;
      return { key, deleted: true, shared: true };
    },
    async list(prefix, shared) {
      if (!shared) {
        const keys = [];
        const p = "chalkline_local:" + (prefix || "");
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(p) === 0) keys.push(k.slice("chalkline_local:".length));
        }
        return { keys, prefix, shared: false };
      }
      const { data, error } = await supabase.from(TABLE).select("key").like("key", (prefix || "") + "%");
      if (error) throw error;
      return { keys: (data || []).map((r) => r.key), prefix, shared: true };
    },
  };

  const rootEl = document.getElementById("root");
  try {
    createRoot(rootEl).render(React.createElement(App));
  } catch (err) {
    rootEl.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;font-family:sans-serif;text-align:center;">' +
      '<h2>Could not start Chalkline</h2><p style="color:#5B5A50;max-width:360px;">' +
      (err && err.message ? err.message : "Unknown error") +
      "</p></div>";
    console.error(err);
  }
</script>
</body>
</html>
